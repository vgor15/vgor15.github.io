# Publishes the site to GitHub Pages.
# Runs when main changes (your admin-panel saves land on main), daily, or by hand.
# The guard step blocks a deploy that would leak personal data or break content;
# when it fails the live site simply stays on the last good version.
name: Deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 0 * * *" # 05:47 IST daily: keeps the sitemap date fresh
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build and check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: node scripts/build.mjs
      - name: Guard (content, secrets, personal data, image metadata)
        env:
          PRIVACY_PATTERNS: ${{ secrets.PRIVACY_PATTERNS }}
        run: node scripts/check.mjs _site
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  indexnow:
    name: Tell search engines about the update (IndexNow)
    needs: deploy
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Submit the sitemap URLs to Bing, Yandex, Seznam and Naver
        run: |
          set -euo pipefail
          sleep 30 # let GitHub Pages finish serving the new version
          key=4263b288c0d80406a6bed926c7695b75
          urls=$(curl -sf --max-time 20 https://vgor15.github.io/sitemap.xml | grep -o '<loc>[^<]*' | sed 's/<loc>//' | jq -R . | jq -s .)
          body=$(jq -n --arg k "$key" --argjson u "$urls" '{host:"vgor15.github.io", key:$k, keyLocation:("https://vgor15.github.io/" + $k + ".txt"), urlList:$u}')
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 -X POST https://api.indexnow.org/indexnow -H 'Content-Type: application/json; charset=utf-8' -d "$body")
          echo "IndexNow answered HTTP $code for $(echo "$urls" | jq length) URLs"
          case "$code" in 200|202) ;; *) echo "::warning::IndexNow answered HTTP $code";; esac
