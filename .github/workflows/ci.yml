# Runs on every pull request and every push to main.
# Nothing here can publish the site; deploy.yml does that.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    name: Content and privacy guard
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Build the publishable site
        run: node scripts/build.mjs
      - name: Check content, secrets, personal data and image metadata
        env:
          # Optional repo secret: extra private words to block, as one regex. Never written in the repo.
          PRIVACY_PATTERNS: ${{ secrets.PRIVACY_PATTERNS }}
        run: node scripts/check.mjs _site

  html:
    name: HTML validation
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund --ignore-scripts html-validate@11.23.0
      - run: npx --no-install html-validate "*.html" "lab/*.html" "writing/*.html" "admin/*.html"

  test-device:
    name: Browser tests (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: desktop
            browser: chromium
          - project: iphone
            browser: webkit
          - project: ipad
            browser: webkit
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund --ignore-scripts
      - run: npx --no-install playwright install --with-deps ${{ matrix.browser }}
      - run: npx --no-install playwright test --project=${{ matrix.project }}
      - name: Upload report and screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-${{ matrix.project }}
          path: playwright-report/
          retention-days: 14

  # One summary check with the old name, so branch protection keeps working.
  test:
    name: Browser tests (desktop, iPhone, iPad)
    needs: test-device
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - run: |
          echo "Device results: ${{ needs.test-device.result }}"
          [ "${{ needs.test-device.result }}" = "success" ]

  lighthouse:
    name: Lighthouse budgets
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: node scripts/build.mjs
      - run: npm install --no-audit --no-fund --ignore-scripts @lhci/cli@0.16.1
      - run: npx --no-install lhci autorun
      - name: Upload Lighthouse reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lighthouse
          path: .lighthouseci/
          include-hidden-files: true
          retention-days: 14

  links:
    name: Internal links
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: node scripts/build.mjs
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with:
          # GitHub Pages serves /lab from lab.html even though a lab/ folder exists; the remap does the same.
          args: >-
            --offline --no-progress
            --root-dir ${{ github.workspace }}/_site
            --fallback-extensions html --index-files index.html
            --remap '^(file://.*/_site/(?:lab|writing))/?$ $1.html'
            '_site/**/*.html'
          fail: true
