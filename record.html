<!doctype html>
<html lang="en" class="no-js" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Record :: Vyom Gor</title>
  <meta name="description" content="A framing tool for recording pages of this site at fixed sizes.">
  <meta name="robots" content="noindex">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://app.cal.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.cal.com; font-src 'self'; connect-src 'self' https://*.cal.com; frame-src 'self' https://cal.com https://*.cal.com; media-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
  <meta name="referrer" content="no-referrer">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/css/site.css">
  <script src="/assets/js/frame-guard.js"></script>
  <script src="/assets/js/theme-boot.js"></script>
</head>
<body data-page="record" data-no-info>
  <main id="main">
    <h1 class="sr-only">Record</h1>
    <div class="rec-bar" role="toolbar" aria-label="Recording frame">
      <select id="recPage" aria-label="Page to frame"></select>
      <div class="seg-inline">
        <button type="button" data-ratio="16:10" class="is-on">16:10</button>
        <button type="button" data-ratio="16:9">16:9</button>
        <button type="button" data-ratio="4:3">4:3</button>
        <button type="button" data-ratio="1:1">1:1</button>
        <button type="button" data-ratio="9:16">9:16</button>
      </div>
      <div class="seg-inline">
        <button type="button" class="js-fit is-on">Fit</button>
        <button type="button" class="js-bare">Bare</button>
        <button type="button" class="js-hide">Hide UI</button>
      </div>
      <span class="rec-size">1440 × 900</span>
    </div>
    <div class="rec-stage"><iframe class="rec-frame" title="Framed page"></iframe></div>
    <p class="rec-note">Own pages always embed. H / Esc hides this bar, then grab the frame with your screen recorder.</p>
  </main>
  <script src="/assets/vendor/gsap.min.js"></script>
  <script src="/assets/js/content.js"></script>
  <script src="/assets/js/core.js"></script>
  <script src="/assets/js/fun.js"></script>
  <script src="/assets/js/record.js"></script>
</body>
</html>
