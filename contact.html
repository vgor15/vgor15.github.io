<body data-page="contact">
  <main id="main" class="page contact">
    <h1 class="sr-only">Contact Vyom Gor</h1>
    <div class="desk">
      <aside class="stub" aria-label="Ticket stub">
        <svg class="stub__clip" viewBox="0 0 18 54" fill="none" aria-hidden="true"><path d="M5 50V10a4 4 0 0 1 8 0v34a2.5 2.5 0 0 1-5 0V14" stroke="#8a8a8a" stroke-width="2" stroke-linecap="round"/></svg>
        <h5>Vyom Gor :: Bench</h5>
        <div class="stub__sub">Intake · Counter 01</div>
        <dl>
          <dt>Job</dt><dd class="js-job">——</dd>
          <dt>Received</dt><dd class="js-rec">——</dd>
          <dt>Reply by</dt><dd class="js-reply">——</dd>
          <dt>Status</dt><dd class="js-stat">Blank</dd>
          <dt>File under</dt><dd class="js-file">Opportunity</dd>
        </dl>
        <div class="stub__bar"><svg preserveAspectRatio="none" aria-hidden="true"></svg></div>
        <div class="stub__keep">Keep this half</div>
      </aside>

      <div class="letter" role="group" aria-label="Letter to Vyom">
        <div class="letter__head">
          <div class="letter__mark" aria-hidden="true"><span>V</span><span>G</span></div>
          <div class="letter__who">
            <b>Vyom Gor</b>
            <small>Embedded Software Engineer</small>
            <small><button class="js-reveal" type="button">Reveal email</button> · <span class="js-loc"></span></small>
          </div>
        </div>
        <div class="letter__date js-date"></div>
        <div class="letter__dear">Dear Vyom,</div>
        <div class="l-re"><span>RE ::</span>
          <div class="l-re__opts" role="group" aria-label="Regarding">
            <button type="button" data-re="Opportunity" aria-pressed="true">[X] Opportunity</button>
            <button type="button" data-re="A collaboration" aria-pressed="false">[ ] A collaboration</button>
            <button type="button" data-re="Just a hello" aria-pressed="false">[ ] Just a hello</button>
          </div>
        </div>
        <label class="l-field"><span>FROM ::</span><input id="from" type="email" placeholder="you@example.com" autocomplete="email" required></label>
        <label class="l-field"><span>VIA ::</span><input id="via" type="text" placeholder="A friend, LinkedIn, GitHub, a search… (optional)"></label>
        <textarea class="l-body" id="letter" placeholder="What are we building?" aria-label="The letter"></textarea>
        <div class="l-sinc">Sincerely,</div>
        <div class="l-sign"><canvas role="img" aria-label="Signature pad: draw your signature with a finger or mouse"></canvas><span class="l-sign__ph">sign here</span><button class="l-sign__clr" type="button" hidden>Clear</button></div>
        <div class="l-name"><input id="name" type="text" placeholder="Your name" autocomplete="name" aria-label="Your name"></div>
        <div class="l-foot"><small class="js-status">One reply, no newsletter · not yet signed</small><button class="l-send" type="button" disabled>Send it</button></div>
      </div>
      <p class="l-alt">Prefer a call? <button class="js-cal" type="button">Book 15 minutes</button> · or <button class="js-copy" type="button">copy my email</button></p>
    </div>
  </main>
