<body data-page="lab-exp">
  <main id="main" class="exp">
    <header class="exp__meta">
      <div class="crumbs"><a class="tag" href="/lab">← Lab</a><span class="tag">CANVAS</span><span class="tag tag--new">New</span></div>
      <h1>Logic Analyzer</h1>
      <p>Three serial buses I use on the bench, side by side. Type text or hex bytes (<code>0x56 0x47</code>) and watch the same data framed as UART, I2C or SPI, with each byte decoded underneath.</p>
    </header>
    <section class="exp__stage la">
      <div class="la-in">
        <div class="seg-inline" role="group" aria-label="Protocol">
          <button type="button" data-proto="uart" class="is-on">UART</button>
          <button type="button" data-proto="i2c">I2C</button>
          <button type="button" data-proto="spi">SPI</button>
        </div>
        <label class="label">Data <input id="bytes" type="text" value="VG" maxlength="40" aria-label="Bytes to send"></label>
        <label class="label" id="addrWrap" hidden>Addr <input id="addr" type="text" value="0x50" maxlength="4" style="width:70px" aria-label="I2C address"></label>
        <span class="label" id="lainfo"></span>
      </div>
      <canvas id="scope" role="img" aria-label="Waveform"></canvas>
    </section>
  </main>
  <script src="/assets/vendor/gsap.min.js"></script>
  <script src="/assets/vendor/lenis.min.js"></script>
  <script src="/assets/js/content.js"></script>
  <script src="/assets/js/core.js"></script>
  <script src="/assets/js/lab/logic-analyzer.js"></script>
