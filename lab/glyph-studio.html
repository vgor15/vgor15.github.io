<body data-page="lab-exp">
  <main id="main" class="exp">
    <header class="exp__meta">
      <div class="crumbs"><a class="tag" href="/lab">← Lab</a><span class="tag">TOOL</span><span class="tag tag--new">New</span></div>
      <h1>Glyph Studio</h1>
      <p>An HD44780 LCD has eight user-definable 5×8 characters in CGRAM. The slots below start with the eight glyphs from my CAN dashboard's <code>lcd_cgram()</code>. Draw, then copy the array into C.</p>
    </header>
    <section class="exp__stage exp__grid">
      <div>
        <p class="label" id="gname" style="margin-bottom:10px">Slot 0</p>
        <div style="display:flex;gap:22px;flex-wrap:wrap;align-items:flex-start">
          <div class="glyph-ed" id="editor" role="group" aria-label="5 by 8 pixel editor"></div>
          <div style="display:flex;flex-direction:column;gap:6px">
            <button class="btn" type="button" data-op="up">Shift ↑</button>
            <button class="btn" type="button" data-op="down">Shift ↓</button>
            <button class="btn" type="button" data-op="left">Shift ←</button>
            <button class="btn" type="button" data-op="right">Shift →</button>
            <button class="btn" type="button" data-op="invert">Invert</button>
            <button class="btn" type="button" data-op="clear">Clear</button>
            <button class="btn" type="button" data-op="reset">Reset slot</button>
          </div>
        </div>
        <div class="slots" id="slots" role="group" aria-label="CGRAM slots 0 to 7"></div>
      </div>
      <div>
        <p class="label" style="margin-bottom:10px">Preview · 16×2</p>
        <div class="lcd"><canvas id="preview" aria-label="LCD preview of all eight glyphs"></canvas></div>
        <p class="label" style="margin:18px 0 8px">C · CGRAM array</p>
        <pre class="code" id="out"></pre>
      </div>
    </section>
  </main>
  <script src="/assets/vendor/gsap.min.js"></script>
  <script src="/assets/vendor/lenis.min.js"></script>
  <script src="/assets/js/content.js"></script>
  <script src="/assets/js/can.js"></script>
  <script src="/assets/js/core.js"></script>
  <script src="/assets/js/lab/glyph-studio.js"></script>
</body>
</html>
