<!doctype html>
<html lang="en" class="no-js" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Board :: Drive this site from a CAN board</title>
  <meta name="description" content="Drive Vyom Gor's portfolio from his 3D CAN dashboard board: flip the DIP switches to pick a page, turn the knob, press SEND and watch the LCD.">
  <link rel="canonical" href="https://vgor15.github.io/board">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://app.cal.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.cal.com; font-src 'self'; connect-src 'self' https://*.cal.com; frame-src 'self' https://cal.com https://*.cal.com; media-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
  <meta name="referrer" content="no-referrer">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="/assets/fonts/Geist-Variable.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/assets/css/site.css">
  <script src="/assets/js/frame-guard.js"></script>
  <script src="/assets/js/theme-boot.js"></script>
</head>
<body data-page="board">
  <main id="main" class="boardpg">
    <h1 class="sr-only">Board: drive this site from Vyom's CAN board</h1>
    <canvas class="boardpg__cv" role="img" aria-label="Vyom's CAN dashboard board in 3D: four DIP switches, a knob, a SEND button and a 16 by 2 LCD"></canvas>
    <section class="boardpg__ui" aria-label="Board controls">
      <p class="label">Drive the site · flip, turn, send</p>
      <p class="boardpg__lcd" aria-live="polite"><span class="js-l1">&gt; ABOUT</span><span class="js-l2">SW 0001 · /about</span></p>
      <div class="boardpg__sw" role="group" aria-label="DIP switches, binary page number">
        <button type="button" class="dip" data-bit="3" aria-pressed="false"><b>SW1</b><span>8</span></button>
        <button type="button" class="dip" data-bit="2" aria-pressed="false"><b>SW2</b><span>4</span></button>
        <button type="button" class="dip" data-bit="1" aria-pressed="false"><b>SW3</b><span>2</span></button>
        <button type="button" class="dip" data-bit="0" aria-pressed="true"><b>SW4</b><span>1</span></button>
      </div>
      <div class="boardpg__row">
        <button type="button" class="btn js-prev" aria-label="Knob left: previous page">⟲ Knob</button>
        <button type="button" class="btn js-next" aria-label="Knob right: next page">Knob ⟳</button>
        <button type="button" class="btn btn--ink js-send">SEND</button>
      </div>
      <p class="boardpg__help">Flip the blue switches or turn the knob to pick a page, then press SEND. Keys work too: ← →, 1–4 and Enter.</p>
    </section>
  </main>
  <script src="/assets/vendor/gsap.min.js"></script>
  <script src="/assets/js/content.js"></script>
  <script src="/assets/js/core.js"></script>
  <script src="/assets/js/fun.js"></script>
  <script type="module" src="/assets/js/world/boot.js"></script>
  <script src="/assets/vendor/three.min.js"></script>
  <script src="/assets/js/board.js"></script>
</body>
</html>
